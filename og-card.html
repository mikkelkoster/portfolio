<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Source for public/meta/og-image.png. Render at exactly 1200x630:
     Chrome --headless --window-size=1200,630 --force-device-scale-factor=2
     --screenshot, then downsample to 1200x630. -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap">
<style>
  :root{ --ink:#121212; --ink-55:rgba(0,0,0,0.55); --surface:#f7f7f7; --green:#16a34a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#fff;overflow:hidden}
  body{
    font-family:'General Sans',sans-serif;
    color:var(--ink);
    display:flex; align-items:stretch; gap:56px;
    padding:56px;
    -webkit-font-smoothing:antialiased;
  }
  .text{ flex:1; display:flex; flex-direction:column; justify-content:center;
         position:relative; }

  h1{
    font-size:80px; font-weight:400; line-height:1.14; letter-spacing:-0.04em;
    /* the site's optical pull — General Sans has a 0.081em left side bearing,
       so the box lines up but the ink does not */
    margin-left:-0.065em;
  }

  .sign{
    position:absolute; left:0; bottom:0;
    display:flex; align-items:baseline; gap:18px;
    font-size:26px; letter-spacing:-0.02em;
  }
  .sign b{ font-weight:500; }
  /* A step down rather than the same size in grey — at 26px two identical
     sizes read as one string broken by a gap. */
  .sign span{ color:var(--ink-55); font-weight:400; font-size:22px; }

  /* Same panel as .hero__figure: surface ground, 20px radius, a ratio wider
     than the plate's 0.489 so cover crops the bottom and never the arms. */
  .figure{
    flex:0 0 auto; align-self:center;
    height:100%; aspect-ratio:0.78;
    background:var(--surface); border-radius:20px;
    overflow:hidden; position:relative;
  }
  .figure img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center 8%;
    filter:grayscale(1) contrast(1.03);
  }
</style></head>
<body>
  <div class="text">
    <h1>Design at scale.<br>Player-coach.<br>Maker.</h1>
    <p class="sign"><b>Mikkel Køster</b><span>mikkelkoster.com</span></p>
  </div>
  <div class="figure">
    <img src="public/images/main/main-photo-mikkel.png" alt="">
  </div>
</body></html>
